name: 更新繁體中文分類行事曆

on:
  workflow_dispatch:

  schedule:
    # 台灣時間每天上午約 09:17
    - cron: "17 1 * * *"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: 下載專案
        uses: actions/checkout@v6

      - name: 設定 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 產生所有繁體中文分類行事曆
        run: python translate_calendar.py

      - name: 檢查完整行事曆
        run: |
          test -s docs/all.ics
          grep -q "BEGIN:VCALENDAR" docs/all.ics
          grep -q "BEGIN:VEVENT" docs/all.ics
          grep -q "END:VCALENDAR" docs/all.ics

      - name: 檢查主要分類檔案
        run: |
          test -s docs/community-day.ics
          test -s docs/spotlight-hour.ics
          test -s docs/raid-hour.ics
          test -s docs/raid-day.ics
          test -s docs/raid-battles.ics
          test -s docs/research.ics
          test -s docs/season.ics
          test -s docs/index.html

      - name: 儲存更新結果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/

          if git diff --cached --quiet; then
            echo "行事曆內容沒有變化，不需提交。"
          else
            git commit -m "自動更新繁體中文分類行事曆"
            git push
          fi
